<svg xmlns="http://www.w3.org/2000/svg" width="580" height="200" viewBox="0 0 580 200" role="img" aria-label="Collectra CMS: Collections and hire-purchase accounts for retail branches, with Android and iPhone apps.">
  <title>Collectra CMS</title>
  <defs>
    <radialGradient id="glow" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#3ee6c1" stop-opacity=".28"/>
      <stop offset="1" stop-color="#3ee6c1" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="580" height="200" rx="18"/></clipPath>
  </defs>
  <style>
    .title { font: 700 26px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #eef4ff; letter-spacing: -.4px; }
    .body { font: 400 16px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #a9b8d6; }
    .tag { font: 500 13px 'Cascadia Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill: #a9b8d6; }
    .status { font: 600 13px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #3ee6c1; }
    .glow { animation: breathe 7s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{opacity:.7} 50%{opacity:1} }
    .dot { animation: ping 2.4s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes ping { 0%{transform:scale(1);opacity:.7} 80%,100%{transform:scale(2.6);opacity:0} }
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="580" height="200" fill="#0d1628"/>
    <rect width="580" height="200" fill="url(#glow)" class="glow"/>
    <g transform="translate(524 54)"><g transform="translate(-17.0 -17.0) scale(1.4167)" fill="none" stroke="#3ee6c1" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
  <path d="m9 12 2 2 4-4" /></g></g>
    <text x="32" y="62" class="title">Collectra CMS</text>
    <text x="548" y="169" class="status" text-anchor="end">Live</text>
    <circle cx="508" cy="164" r="4.5" fill="#3ee6c1" class="dot"/>
    <circle cx="508" cy="164" r="4.5" fill="#3ee6c1"/>
    <text x="32" y="104" class="body">Collections and hire-purchase accounts for</text><text x="32" y="128" class="body">retail branches, with Android and iPhone apps.</text>
    <rect x="32" y="150" width="57" height="28" rx="14" fill="#16233c"/><text x="60" y="169" class="tag" text-anchor="middle">React</text><rect x="97.0" y="150" width="82" height="28" rx="14" fill="#16233c"/><text x="138" y="169" class="tag" text-anchor="middle">Supabase</text><rect x="186.6" y="150" width="90" height="28" rx="14" fill="#16233c"/><text x="232" y="169" class="tag" text-anchor="middle">Capacitor</text>
    <rect x=".5" y=".5" width="579" height="199" rx="18" fill="none" stroke="#1f2c47"/>
  </g>
</svg>
