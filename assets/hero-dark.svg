  <style>
    .name { font: 700 64px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; letter-spacing: -1.6px; fill: url(#nameGrad); }
    .aka { font: 500 22px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #6f7f9f; }
    .role { font: 500 24px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #a9b8d6; opacity: 0; animation: role 12s infinite; }
    .r1 { animation-delay: 4s; } .r2 { animation-delay: 8s; }
    @keyframes role { 0%{opacity:0;transform:translateY(8px)} 4%,30%{opacity:1;transform:none} 34%,100%{opacity:0;transform:translateY(-6px)} }
    .loc { font: 500 15px 'Cascadia Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill: #6f7f9f; letter-spacing: .4px; }
    .star { fill: #eef4ff; animation: tw 4s ease-in-out infinite; }
    @keyframes tw { 0%,100%{opacity:.15} 50%{opacity:.9} }
    .curtain { animation: sway 16s ease-in-out infinite alternate; transform-origin: 50% 0; }
    @keyframes sway { from{transform:skewX(-6deg) translateX(-30px)} to{transform:skewX(6deg) translateX(30px)} }
    .dash { stroke-dasharray: 14 10; animation: flow 3s linear infinite; }
    @keyframes flow { to{stroke-dashoffset:-48} }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50%{opacity:0} }
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
