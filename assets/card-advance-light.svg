<svg xmlns="http://www.w3.org/2000/svg" width="580" height="200" viewBox="0 0 580 200" role="img" aria-label="Advance Manager: Tracks advance payments across companies, vendors and crews, request to settlement.">
  <title>Advance Manager</title>
  <defs>
    <radialGradient id="glow" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".28"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="580" height="200" rx="18"/></clipPath>
  </defs>
  <style>
    .title { font: 700 26px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #0f1a33; letter-spacing: -.4px; }
    .body { font: 400 16px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #43506b; }
    .tag { font: 500 13px 'Cascadia Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill: #43506b; }
    .status { font: 600 13px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #0f8f7e; }
    .glow { animation: breathe 7s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{opacity:.7} 50%{opacity:1} }
    .dot { animation: ping 2.4s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes ping { 0%{transform:scale(1);opacity:.7} 80%,100%{transform:scale(2.6);opacity:0} }
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="580" height="200" fill="#ffffff"/>
    <rect width="580" height="200" fill="url(#glow)" class="glow"/>
    <g transform="translate(524 52)" opacity=".9"><rect x="-12" y="-15" width="24" height="30" rx="3" fill="none" stroke="#2dd4bf" stroke-width="2"/><path d="M-6 -6 H6 M-6 0 H6 M-6 6 H2" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round"/></g>
    <text x="32" y="62" class="title">Advance Manager</text>
    <text x="548" y="169" class="status" text-anchor="end">Live</text>
    <circle cx="508" cy="164" r="4.5" fill="#2dd4bf" class="dot"/>
    <circle cx="508" cy="164" r="4.5" fill="#2dd4bf"/>
    <text x="32" y="104" class="body">Tracks advance payments across companies,</text><text x="32" y="128" class="body">vendors and crews, request to settlement.</text>
    <rect x="32" y="150" width="98" height="28" rx="14" fill="#eef3fb"/><text x="81" y="169" class="tag" text-anchor="middle">TypeScript</text><rect x="138.0" y="150" width="98" height="28" rx="14" fill="#eef3fb"/><text x="187" y="169" class="tag" text-anchor="middle">PostgreSQL</text><rect x="244.0" y="150" width="65" height="28" rx="14" fill="#eef3fb"/><text x="277" y="169" class="tag" text-anchor="middle">Docker</text>
    <rect x=".5" y=".5" width="579" height="199" rx="18" fill="none" stroke="#dde6f3"/>
  </g>
</svg>
