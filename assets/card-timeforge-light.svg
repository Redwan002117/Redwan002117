<svg xmlns="http://www.w3.org/2000/svg" width="580" height="200" viewBox="0 0 580 200" role="img" aria-label="TimeForge: An open-world builder on the real map of Earth, running in the browser.">
  <title>TimeForge</title>
  <defs>
    <radialGradient id="glow" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#818cf8" stop-opacity=".28"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="580" height="200" rx="18"/></clipPath>
  </defs>
  <style>
    .title { font: 700 26px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #0f1a33; letter-spacing: -.4px; }
    .body { font: 400 16px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #43506b; }
    .tag { font: 500 13px 'Cascadia Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill: #43506b; }
    .status { font: 600 13px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #4f46e5; }
    .glow { animation: breathe 7s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{opacity:.7} 50%{opacity:1} }
    .dot { animation: ping 2.4s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes ping { 0%{transform:scale(1);opacity:.7} 80%,100%{transform:scale(2.6);opacity:0} }
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="580" height="200" fill="#ffffff"/>
    <rect width="580" height="200" fill="url(#glow)" class="glow"/>
    <g transform="translate(524 54)"><g transform="translate(-17.0 -17.0) scale(1.4167)" fill="none" stroke="#818cf8" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M21.54 15H17a2 2 0 0 0-2 2v4.54" />
  <path d="M7 3.34V5a3 3 0 0 0 3 3a2 2 0 0 1 2 2c0 1.1.9 2 2 2a2 2 0 0 0 2-2c0-1.1.9-2 2-2h3.17" />
  <path d="M11 21.95V18a2 2 0 0 0-2-2a2 2 0 0 1-2-2v-1a2 2 0 0 0-2-2H2.05" />
  <circle cx="12" cy="12" r="10" /></g></g>
    <text x="32" y="62" class="title">TimeForge</text>
    <text x="548" y="169" class="status" text-anchor="end">Building</text>
    
    <circle cx="481" cy="164" r="4.5" fill="#818cf8"/>
    <text x="32" y="104" class="body">An open-world builder on the real map</text><text x="32" y="128" class="body">of Earth, running in the browser.</text>
    <rect x="32" y="150" width="82" height="28" rx="14" fill="#eef3fb"/><text x="73" y="169" class="tag" text-anchor="middle">three.js</text><rect x="121.6" y="150" width="82" height="28" rx="14" fill="#eef3fb"/><text x="162" y="169" class="tag" text-anchor="middle">MapLibre</text><rect x="211.2" y="150" width="49" height="28" rx="14" fill="#eef3fb"/><text x="236" y="169" class="tag" text-anchor="middle">Node</text>
    <rect x=".5" y=".5" width="579" height="199" rx="18" fill="none" stroke="#dde6f3"/>
  </g>
</svg>
