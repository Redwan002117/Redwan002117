<svg xmlns="http://www.w3.org/2000/svg" width="580" height="200" viewBox="0 0 580 200" role="img" aria-label="MessManager: Meals, groceries and dues for a shared mess: meal rate, ledgers and settlement.">
  <title>MessManager</title>
  <defs>
    <radialGradient id="glow" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#7c8cff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7c8cff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="580" height="200" rx="18"/></clipPath>
  </defs>
  <style>
    .title { font: 700 26px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #eef4ff; letter-spacing: -.4px; }
    .body { font: 400 16px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #a9b8d6; }
    .tag { font: 500 13px 'Cascadia Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill: #a9b8d6; }
    .status { font: 600 13px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #9aa6ff; }
    .glow { animation: breathe 7s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{opacity:.7} 50%{opacity:1} }
    .dot { animation: ping 2.4s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes ping { 0%{transform:scale(1);opacity:.7} 80%,100%{transform:scale(2.6);opacity:0} }
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="580" height="200" fill="#0d1628"/>
    <rect width="580" height="200" fill="url(#glow)" class="glow"/>
    <g transform="translate(524 52)" opacity=".9"><path d="M-15 -1 H15 C15 10 7 15 0 15 C-7 15 -15 10 -15 -1 Z" fill="none" stroke="#7c8cff" stroke-width="2"/><path d="M-5 -6 C-7 -9 -3 -11 -5 -14 M3 -6 C1 -9 5 -11 3 -14" fill="none" stroke="#7c8cff" stroke-width="1.6" stroke-linecap="round"/></g>
    <text x="32" y="62" class="title">MessManager</text>
    <text x="548" y="169" class="status" text-anchor="end">Live</text>
    <circle cx="508" cy="164" r="4.5" fill="#7c8cff" class="dot"/>
    <circle cx="508" cy="164" r="4.5" fill="#7c8cff"/>
    <text x="32" y="104" class="body">Meals, groceries and dues for a shared mess:</text><text x="32" y="128" class="body">meal rate, ledgers and settlement.</text>
    <rect x="32" y="150" width="73" height="28" rx="14" fill="#16233c"/><text x="69" y="169" class="tag" text-anchor="middle">Next.js</text><rect x="113.39999999999999" y="150" width="82" height="28" rx="14" fill="#16233c"/><text x="154" y="169" class="tag" text-anchor="middle">Supabase</text><rect x="203.0" y="150" width="41" height="28" rx="14" fill="#16233c"/><text x="223" y="169" class="tag" text-anchor="middle">PWA</text>
    <rect x=".5" y=".5" width="579" height="199" rx="18" fill="none" stroke="#1f2c47"/>
  </g>
</svg>
