<svg xmlns="http://www.w3.org/2000/svg" width="580" height="200" viewBox="0 0 580 200" role="img" aria-label="MessManager: Meals, groceries and dues for a shared mess: meal rate, ledgers and settlement.">
  <title>MessManager</title>
  <defs>
    <radialGradient id="glow" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#7c8cff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7c8cff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="580" height="200" rx="18"/></clipPath>
