<svg xmlns="http://www.w3.org/2000/svg" width="580" height="200" viewBox="0 0 580 200" role="img" aria-label="Homelab: My own Linux server for apps in Docker, plus Wi-Fi sensing with ESP32-C6 nodes.">
  <title>Homelab</title>
  <defs>
    <radialGradient id="glow" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#b48cff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#b48cff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="580" height="200" rx="18"/></clipPath>
  </defs>
  <style>
    .title { font: 700 26px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #eef4ff; letter-spacing: -.4px; }
    .body { font: 400 16px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #a9b8d6; }
    .tag { font: 500 13px 'Cascadia Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill: #a9b8d6; }
    .status { font: 600 13px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #c4a8ff; }
    .glow { animation: breathe 7s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{opacity:.7} 50%{opacity:1} }
    .dot { animation: ping 2.4s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes ping { 0%{transform:scale(1);opacity:.7} 80%,100%{transform:scale(2.6);opacity:0} }
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="580" height="200" fill="#0d1628"/>
    <rect width="580" height="200" fill="url(#glow)" class="glow"/>
    <g transform="translate(524 52)" opacity=".9"><rect x="-10" y="-10" width="20" height="20" rx="3" fill="none" stroke="#b48cff" stroke-width="2"/><path d="M-5 -14 V-10 M0 -14 V-10 M5 -14 V-10 M-5 10 V14 M0 10 V14 M5 10 V14 M-14 -5 H-10 M-14 0 H-10 M-14 5 H-10 M10 -5 H14 M10 0 H14 M10 5 H14" stroke="#b48cff" stroke-width="1.6"/></g>
    <text x="32" y="62" class="title">Homelab</text>
    <text x="548" y="169" class="status" text-anchor="end">Running</text>
    <circle cx="488" cy="164" r="4.5" fill="#b48cff" class="dot"/>
    <circle cx="488" cy="164" r="4.5" fill="#b48cff"/>
    <text x="32" y="104" class="body">My own Linux server for apps in Docker,</text><text x="32" y="128" class="body">plus Wi-Fi sensing with ESP32-C6 nodes.</text>
    <rect x="32" y="150" width="57" height="28" rx="14" fill="#16233c"/><text x="60" y="169" class="tag" text-anchor="middle">Linux</text><rect x="97.0" y="150" width="57" height="28" rx="14" fill="#16233c"/><text x="126" y="169" class="tag" text-anchor="middle">ESP32</text><rect x="162.0" y="150" width="98" height="28" rx="14" fill="#16233c"/><text x="211" y="169" class="tag" text-anchor="middle">Cloudflare</text>
    <rect x=".5" y=".5" width="579" height="199" rx="18" fill="none" stroke="#1f2c47"/>
  </g>
</svg>
