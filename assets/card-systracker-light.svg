<svg xmlns="http://www.w3.org/2000/svg" width="580" height="200" viewBox="0 0 580 200" role="img" aria-label="SysTracker: Self-hosted monitoring for a fleet of machines: CPU, memory, disk, network.">
  <title>SysTracker</title>
  <defs>
    <radialGradient id="glow" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="580" height="200" rx="18"/></clipPath>
  </defs>
  <style>
    .title { font: 700 26px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #0f1a33; letter-spacing: -.4px; }
    .body { font: 400 16px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #43506b; }
    .tag { font: 500 13px 'Cascadia Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill: #43506b; }
    .status { font: 600 13px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #0369a1; }
    .glow { animation: breathe 7s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{opacity:.7} 50%{opacity:1} }
    .dot { animation: ping 2.4s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes ping { 0%{transform:scale(1);opacity:.7} 80%,100%{transform:scale(2.6);opacity:0} }
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="580" height="200" fill="#ffffff"/>
    <rect width="580" height="200" fill="url(#glow)" class="glow"/>
    <g transform="translate(524 52)" opacity=".9"><path d="M-16 2 H-8 L-4 -10 L2 12 L6 -2 H16" fill="none" stroke="#7dd3fc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="32" y="62" class="title">SysTracker</text>
    <text x="548" y="169" class="status" text-anchor="end">Active</text>
    
    <circle cx="494" cy="164" r="4.5" fill="#7dd3fc"/>
    <text x="32" y="104" class="body">Self-hosted monitoring for a fleet of</text><text x="32" y="128" class="body">machines: CPU, memory, disk, network.</text>
    <rect x="32" y="150" width="65" height="28" rx="14" fill="#eef3fb"/><text x="65" y="169" class="tag" text-anchor="middle">Docker</text><rect x="105.19999999999999" y="150" width="49" height="28" rx="14" fill="#eef3fb"/><text x="130" y="169" class="tag" text-anchor="middle">Node</text><rect x="162.0" y="150" width="65" height="28" rx="14" fill="#eef3fb"/><text x="195" y="169" class="tag" text-anchor="middle">Agents</text>
    <rect x=".5" y=".5" width="579" height="199" rx="18" fill="none" stroke="#dde6f3"/>
  </g>
</svg>
