<svg xmlns="http://www.w3.org/2000/svg" width="400" height="128" viewBox="0 0 400 128" role="img" aria-label="BohuPay: Drop-in payments for Bangladeshi gateways">
  <title>BohuPay</title>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#818cf8" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1"><stop offset="0" stop-color="#818cf8" stop-opacity=".16"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="400" height="128" rx="16"/></clipPath>
  </defs>
  <style>
    .title { font: 700 19px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #0f1a33; letter-spacing: -.2px; }
    .line { font: 400 14px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #43506b; }
    .where { font: 500 12px 'Cascadia Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill: #4f46e5; }
    .shine { animation: shine 9s ease-in-out infinite; }
    @keyframes shine { 0%,100%{opacity:.6} 50%{opacity:1} }
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="400" height="128" fill="#ffffff"/>
    <rect width="400" height="128" fill="url(#glow)" class="shine"/>
    <rect x="0" y="0" width="4" height="128" fill="url(#edge)"/>
    <g transform="translate(46 48)"><g transform="translate(-13.0 -13.0) scale(1.0833)" fill="none" stroke="#818cf8" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2" />
  <line x1="2" x2="22" y1="10" y2="10" /></g></g>
    <text x="78" y="55" class="title">BohuPay</text>
    <text x="26" y="88" class="line">Drop-in payments for Bangladeshi gateways</text>
    <text x="26" y="110" class="where">Bohuvuj</text>
    <rect x=".5" y=".5" width="399" height="127" rx="16" fill="none" stroke="#dde6f3"/>
  </g>
</svg>
