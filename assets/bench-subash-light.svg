<svg xmlns="http://www.w3.org/2000/svg" width="400" height="128" viewBox="0 0 400 128" role="img" aria-label="Subash: A fragrance storefront">
  <title>Subash</title>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#c4b5fd" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1"><stop offset="0" stop-color="#c4b5fd" stop-opacity=".16"/><stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="400" height="128" rx="16"/></clipPath>
  </defs>
  <style>
    .title { font: 700 19px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #0f1a33; letter-spacing: -.2px; }
    .line { font: 400 14px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #43506b; }
    .where { font: 500 12px 'Cascadia Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill: #7c3aed; }
    .shine { animation: shine 9s ease-in-out infinite; }
    @keyframes shine { 0%,100%{opacity:.6} 50%{opacity:1} }
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="400" height="128" fill="#ffffff"/>
    <rect width="400" height="128" fill="url(#glow)" class="shine"/>
    <rect x="0" y="0" width="4" height="128" fill="url(#edge)"/>
    <g transform="translate(46 48)"><g transform="translate(-13.0 -13.0) scale(1.0833)" fill="none" stroke="#c4b5fd" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 1 3 3m-3-3a3 3 0 1 0-3 3m3-3v1M9 8a3 3 0 1 0 3 3M9 8h1m5 0a3 3 0 1 1-3 3m3-3h-1m-2 3v-1" />
  <circle cx="12" cy="8" r="2" />
  <path d="M12 10v12" />
  <path d="M12 22c4.2 0 7-1.667 7-5-4.2 0-7 1.667-7 5Z" />
  <path d="M12 22c-4.2 0-7-1.667-7-5 4.2 0 7 1.667 7 5Z" /></g></g>
    <text x="78" y="55" class="title">Subash</text>
    <text x="26" y="88" class="line">A fragrance storefront</text>
    <text x="26" y="110" class="where">suubas.com</text>
    <rect x=".5" y=".5" width="399" height="127" rx="16" fill="none" stroke="#dde6f3"/>
  </g>
</svg>
