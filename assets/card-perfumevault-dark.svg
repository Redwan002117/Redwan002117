<svg xmlns="http://www.w3.org/2000/svg" width="580" height="200" viewBox="0 0 580 200" role="img" aria-label="Perfume Vault: A perfume storefront with its own admin and content tools, for a Dhaka retailer.">
  <title>Perfume Vault</title>
  <defs>
    <radialGradient id="glow" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#b48cff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#b48cff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="580" height="200" rx="18"/></clipPath>
  </defs>
  <style>
    .title { font: 700 26px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #eef4ff; letter-spacing: -.4px; }
    .body { font: 400 16px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #a9b8d6; }
    .tag { font: 500 13px 'Cascadia Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill: #a9b8d6; }
    .status { font: 600 13px 'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; fill: #c4a8ff; }
    .glow { animation: breathe 7s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{opacity:.7} 50%{opacity:1} }
    .dot { animation: ping 2.4s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes ping { 0%{transform:scale(1);opacity:.7} 80%,100%{transform:scale(2.6);opacity:0} }
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="580" height="200" fill="#0d1628"/>
    <rect width="580" height="200" fill="url(#glow)" class="glow"/>
    <g transform="translate(524 52)" opacity=".9"><rect x="-9" y="-6" width="18" height="22" rx="5" fill="none" stroke="#b48cff" stroke-width="2"/><rect x="-4" y="-14" width="8" height="8" rx="1.5" fill="none" stroke="#b48cff" stroke-width="2"/><path d="M-5 4 H5" stroke="#b48cff" stroke-width="1.6"/></g>
    <text x="32" y="62" class="title">Perfume Vault</text>
    <text x="548" y="169" class="status" text-anchor="end">Live</text>
    <circle cx="508" cy="164" r="4.5" fill="#b48cff" class="dot"/>
    <circle cx="508" cy="164" r="4.5" fill="#b48cff"/>
    <text x="32" y="104" class="body">A perfume storefront with its own admin</text><text x="32" y="128" class="body">and content tools, for a Dhaka retailer.</text>
    <rect x="32" y="150" width="73" height="28" rx="14" fill="#16233c"/><text x="69" y="169" class="tag" text-anchor="middle">Next.js</text><rect x="113.39999999999999" y="150" width="82" height="28" rx="14" fill="#16233c"/><text x="154" y="169" class="tag" text-anchor="middle">Supabase</text><rect x="203.0" y="150" width="82" height="28" rx="14" fill="#16233c"/><text x="244" y="169" class="tag" text-anchor="middle">Tailwind</text>
    <rect x=".5" y=".5" width="579" height="199" rx="18" fill="none" stroke="#1f2c47"/>
  </g>
</svg>
